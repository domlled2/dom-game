<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dom Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="preload" href="intro.mp4" as="video" type="video/mp4">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: "Baloo 2", "Trebuchet MS", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ---------- Title screen ---------- */
  #title {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 70% 40% at 85% 0%, rgba(190,225,255,.75), transparent 70%),
      linear-gradient(170deg, transparent 60%, rgba(255,255,255,.08) 75%, transparent 76%),
      radial-gradient(ellipse 120% 35% at 0% 105%, rgba(0,10,50,.95), transparent 70%),
      linear-gradient(180deg, #5aa6ea 0%, #4b8fd6 45%, #2f6db5 80%, #1d4f8f 100%);
  }

  .hero {
    position: relative;
    width: min(70vw, 52vh, 480px);
    display: flex; flex-direction: column; align-items: center;
    margin-top: -6vh;
  }

  .figure { position: relative; width: 72%; }
  .figure img.face {
    position: absolute; left: 28%; top: 54%; width: 46%;
    z-index: 3; filter: none; mix-blend-mode: multiply;
  }
  .figure img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
    position: relative; z-index: 2;
  }
  /* stick shoulders under the head */
  .figure svg {
    position: absolute; left: 50%; top: 86%;
    width: 110%; transform: translateX(-50%);
    z-index: 1; overflow: visible;
  }

  .logo {
    position: relative; z-index: 3;
    margin-top: -10%;
    display: flex; flex-direction: column; line-height: .82;
    color: #fff;
    text-shadow:
      -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
      0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000,
      6px 7px 0 rgba(0,0,0,.55);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .logo .the   { font-size: clamp(22px, 5.5vmin, 46px); align-self: flex-start; margin-left: .2em; }
  .logo .main  { font-size: clamp(54px, 15vmin, 128px); white-space: nowrap; }
  .logo .sub   { font-size: clamp(22px, 5.5vmin, 46px); align-self: flex-end; margin-top: .15em; }

  /* ---------- Bottom area: loading bar, then start button ---------- */
  .bottom {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(7vh + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  .loader { width: min(100%, 560px); text-align: center; }
  .loader .label {
    font-weight: 700; font-size: clamp(16px, 3.2vmin, 24px);
    color: #dce6f2; text-shadow: 0 2px 4px rgba(0,0,0,.45);
    margin-bottom: 8px;
  }
  .bar {
    height: clamp(16px, 2.6vmin, 24px);
    border: 3px solid #000; border-radius: 999px;
    background: rgba(255,255,255,.25);
    overflow: hidden;
    box-shadow: 4px 5px 0 rgba(0,0,0,.45);
  }
  .bar .fill {
    height: 100%; width: 0%;
    background: linear-gradient(180deg, #fff 0%, #dfe9f5 55%, #b9cbe0 100%);
    border-right: 3px solid #000;
  }

  .start-btn {
    display: none;
    font: inherit; font-weight: 800;
    font-size: clamp(26px, 6vmin, 44px);
    letter-spacing: .04em;
    color: #fff;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    background: linear-gradient(180deg, #ffd34d 0%, #ffb400 100%);
    border: 4px solid #000; border-radius: 18px;
    box-shadow: 5px 6px 0 rgba(0,0,0,.55);
    width: min(100%, 340px);
    min-height: 64px;
    padding: .25em 1em .15em;
    cursor: pointer;
    touch-action: manipulation;
    animation: bob 1.4s ease-in-out infinite;
  }
  .start-btn:hover  { filter: brightness(1.08); }
  .start-btn:active { transform: translate(3px, 4px); box-shadow: 2px 2px 0 rgba(0,0,0,.55); animation: none; }
  .start-btn:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  body.loaded .loader    { display: none; }
  body.loaded .start-btn { display: block; }

  /* ---------- Video ---------- */
  #player {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    visibility: hidden;
  }
  body.playing #player { visibility: visible; }
  body.playing #title  { display: none; }
</style>
</head>
<body>

<div id="title">
  <div class="hero">
    <div class="figure">
      <img src="head.png" alt="Dom" draggable="false">
      <img class="face" src="face.png" alt="" draggable="false">
    </div>
    <div class="logo">
      <span class="the">The</span>
      <span class="main">DOM GAME</span>
      <span class="sub">(true story)</span>
    </div>
  </div>
  <div class="bottom">
    <div class="loader">
      <div class="label" id="loadLabel">Loading... 0%</div>
      <div class="bar"><div class="fill" id="loadFill"></div></div>
    </div>
    <button class="start-btn" id="startBtn" type="button">START</button>
  </div>
</div>

<video id="player" src="intro.mp4" preload="auto" playsinline webkit-playsinline></video>

<script>
  const video = document.getElementById('player');
  const title = document.getElementById('title');

  // Preload the whole video into memory so it starts instantly on click.
  // (Falls back to the browser's own preload if fetch isn't allowed, e.g. opened from file://.)
  try {
    fetch('intro.mp4')
      .then(r => { if (!r.ok) throw 0; return r.blob(); })
      .then(blob => {
        if (document.body.classList.contains('playing')) return; // already started, don't interrupt
        video.src = URL.createObjectURL(blob);
        video.load();
      })
      .catch(() => {});
  } catch (e) {}
  video.load();

  let started = false;

  // Background music on the title screen. Browsers block sound until the user
  // touches the page, so if autoplay is blocked it starts on the first tap/click/key.
  const music = new Audio('music.mp3');
  music.loop = true;
  music.volume = 0.6;
  function startMusic() {
    if (started) return;
    const p = music.play();
    if (p && p.then) p.then(removeMusicListeners).catch(() => {});
  }
  const musicEvents = ['pointerdown', 'touchstart', 'keydown'];
  function removeMusicListeners() { musicEvents.forEach(ev => document.removeEventListener(ev, startMusic, true)); }
  musicEvents.forEach(ev => document.addEventListener(ev, startMusic, true));
  startMusic();

  function start() {
    if (started) return;
    started = true;
    music.pause();
    removeMusicListeners();
    document.body.classList.add('playing');
    video.currentTime = 0;
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
    const el = document.documentElement;
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs) { try { const r = fs.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
  }

  // Fake 15-second loading bar (for no reason). Fills in uneven chunks so it feels "real".
  const LOAD_MS = 15000;
  const fill = document.getElementById('loadFill');
  const label = document.getElementById('loadLabel');
  const startBtn = document.getElementById('startBtn');
  // progress curve: [time fraction, progress fraction] — stalls and spurts
  const curve = [[0,0],[.10,.08],[.22,.12],[.30,.31],[.45,.36],[.52,.58],[.70,.62],[.78,.85],[.93,.97],[1,1]];
  function progressAt(t) {
    for (let i = 1; i < curve.length; i++) {
      const [t1, p1] = curve[i], [t0, p0] = curve[i - 1];
      if (t <= t1) return p0 + (p1 - p0) * ((t - t0) / (t1 - t0));
    }
    return 1;
  }
  const t0 = performance.now();
  (function tick() {
    const t = Math.min(1, (performance.now() - t0) / LOAD_MS);
    const pct = Math.floor(progressAt(t) * 100);
    fill.style.width = pct + '%';
    label.textContent = 'Loading... ' + pct + '%';
    if (t < 1) requestAnimationFrame(tick);
    else { document.body.classList.add('loaded'); startBtn.focus({ preventScroll: true }); }
  })();

  startBtn.addEventListener('click', start);
</script>
</body>
</html>
